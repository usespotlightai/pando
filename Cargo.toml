[workspace]
resolver = "3"
members = [
    "pando-format",
    "pando-engine",
    "pando-s3",
    "pando-host",
    "pando-linux",
    "pando-dst",
    "pando",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
repository = "https://github.com/usespotlightai/pando"
publish = false

[workspace.dependencies]
pando-format = { path = "pando-format" }
pando-engine = { path = "pando-engine" }
pando-host = { path = "pando-host" }
pando-s3 = { path = "pando-s3" }

anyhow = "1.0.104"
async-trait = "0.1.92"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
hex = "0.4.3"
libc = "0.2.186"
object_store = { version = "0.14.2", default-features = false }
proptest = "1.12.0"
rand = "0.10.4"
rayon = "1.12.0"
rustix = "1.1.6"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.54.1"
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }
zstd = "0.14.4"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
debug = "line-tables-only"
