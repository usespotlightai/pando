version: 2

updates:
  - package-ecosystem: cargo
    directories: ["/", "/fuzz"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/tools", "/tests/kernel"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: rust
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: golang
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: terraform
    directories: ["/bench/infra", "/bench/infra/bootstrap"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      terraform:
        patterns: ["*"]
