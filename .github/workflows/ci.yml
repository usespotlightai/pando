name: ci

# The checks from tools/check.sh on every pull request and every push to main: lints, supply
# chain, tests on x86_64 and on aarch64, the unsafe code under AddressSanitizer and a short run
# of every fuzz target.
# Then the store conformance tests against the AWS emulator, and the TLA+ model of the write log
# with traces of the engine checked against it (specs/README.md). On main only: the crash and restart
# scenarios over more seeds, line coverage, and an auditable release build. Longer fuzzing and
# mutation testing are in deep.yml; the tests that need a Linux kernel are in kernel.yml
# and xfstests.yml.
# The ruleset on main requires the checks named check, deny and store; check passes only when
# every pull request job before it passed.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  tools:
    name: Check tools
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/tools

  lint:
    name: Lints
    needs: tools
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/tools

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Lints
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tools/check.sh lint

  deny:
    name: deny
    needs: tools
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/tools

      - name: cargo-deny
        run: tools/check.sh deny

  vet:
    name: Vet
    needs: tools
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/tools

      - name: cargo-vet
        run: tools/check.sh vet

  test:
    name: Tests
    needs: tools
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/tools

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Tests
        run: tools/check.sh test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-${{ github.run_id }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn

  # aarch64 as AgentCore Runtime runs it: GitHub's Arm runner, building for generic aarch64 (no
  # target-cpu), so the binaries run on every Graviton generation. The release build is the one
  # release.yml publishes.
  test-aarch64:
    name: Tests on aarch64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/tools

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: aarch64

      - name: Tests
        run: tools/check.sh test

      - name: Release build with its dependency list embedded
        run: |
          tools/check.sh release
          file target/release/pando

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-aarch64-${{ github.run_id }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn

  asan:
    name: AddressSanitizer
    needs: tools
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/tools
        with:
          nightly: "true"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: asan

      - name: pando-host and pando-linux under AddressSanitizer
        run: tools/check.sh asan

  fuzz:
    name: Fuzz smoke
    needs: tools
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/tools
        with:
          nightly: "true"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          key: fuzz

      - name: Every fuzz target for 30 seconds, from the seeds
        run: tools/check.sh fuzz 30

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts-${{ github.run_id }}
          path: fuzz/artifacts
          if-no-files-found: ignore

  check:
    name: check
    if: always()
    needs: [tools, lint, deny, vet, test, test-aarch64, asan, fuzz]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every pull request job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            if [[ $r != success ]]; then
              echo "a needed job ended $r: $RESULTS" >&2
              exit 1
            fi
          done

  coverage:
    name: Coverage
    if: github.event_name != 'pull_request'
    needs: tools
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/tools

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: coverage

      - name: Line coverage
        run: |
          tools/check.sh coverage | tee "$RUNNER_TEMP/coverage.txt"
          { echo '```'; cat "$RUNNER_TEMP/coverage.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.run_id }}
          path: target/coverage/lcov.info

  release:
    name: Auditable release build
    if: github.event_name != 'pull_request'
    needs: tools
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/tools

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release

      - name: Release build with its dependency list embedded
        run: tools/check.sh release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pando-${{ github.sha }}
          path: target/release/pando
          if-no-files-found: error

  scenarios:
    name: Crash and restart scenarios
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Crash and restart over 400 seeds, from a seed that changes with each run
        env:
          PANDO_DST_SEEDS: "400"
          RUN_NUMBER: ${{ github.run_number }}
        run: PANDO_DST_FIRST=$((RUN_NUMBER * 400)) cargo test -p pando-dst --test scenarios

  tla:
    name: TLA+ model and traces
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: tla

      - name: The write log model
        run: PATH=$JAVA_HOME_21_X64/bin:$PATH tools/tlc.sh

      - name: Traces of 40 races, from a seed that changes with each run, against the spec
        env:
          PANDO_DST_SEEDS: "40"
          PANDO_TLA_TRACES: ${{ runner.temp }}/tla-traces
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          PANDO_DST_FIRST=$((RUN_NUMBER * 40)) cargo test -p pando-dst --test scenarios racing
          PATH=$JAVA_HOME_21_X64/bin:$PATH tools/tlc.sh traces "$PANDO_TLA_TRACES"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: tla-traces-${{ github.run_id }}
          path: ${{ runner.temp }}/tla-traces
          if-no-files-found: ignore

  store:
    name: store
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install the AWS emulator (package signed by AWS)
        run: |
          u=https://downloads.aws.com/aws-emulator/packages/aws-emulator/LTS/latest
          f=aws-emulator_amd64.deb
          curl -fsSLO "$u/$f" && curl -fsSLO "$u/$f.sig"
          curl -fsSLo aws.asc https://downloads.aws.com/keys/gpg/current.asc
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          gpg -q --import aws.asc
          gpg --with-colons --fingerprint ssm-publishing@amazon.com | grep -q '^fpr:*98BCF336A3BE53B734E967C52E5BF49BD940F624:'
          gpg -q --verify "$f.sig" "$f"
          sudo apt-get install -y -qq "./$f"
          aws-emulator -v

      - name: Store conformance against the AWS emulator
        env:
          EMULATOR_TELEMETRY: "off"
          S3_BUCKET: pando
          S3_REGION: us-east-1
          S3_ENDPOINT: https://127.0.0.1:9297
          S3_ACCESS_KEY_ID: emulator
          S3_SECRET_ACCESS_KEY: emulator
        run: |
          cargo test -p pando-dst --test store_conformance --no-run
          aws-emulator -a off -t off --idle-timeout 1800 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          for _ in $(seq 300); do grep -q "emulator server information" "$RUNNER_TEMP/emulator.log" && break; sleep 0.1; done
          export SSL_CERT_FILE=$HOME/.aws/emulator/9297/ca.pem
          curl -fsS --cacert "$SSL_CERT_FILE" --aws-sigv4 "aws:amz:$S3_REGION:s3" \
            --user "$S3_ACCESS_KEY_ID:$S3_SECRET_ACCESS_KEY" -X PUT "$S3_ENDPOINT/$S3_BUCKET"
          cargo test -p pando-dst --test store_conformance -- --ignored
