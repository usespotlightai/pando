name: bench

# Creates the bench hosts (bench/infra), runs the bench on them, uploads the results and
# destroys everything. Started by hand only, in the `bench` environment, so pull requests never
# reach its AWS role or secrets. Setup: bench/README.md, "Running from GitHub Actions".

on:
  workflow_dispatch:
    inputs:
      action:
        description: "run: create, bench, destroy. destroy: only remove what a failed run left behind."
        type: choice
        options: [run, destroy]
        default: run
      measure:
        description: "smoke: check the hosts only. Otherwise smoke, then those measures on host a; all: fork, cold, warm, replay, save, fio and crash. A measure skips the systems it does not have."
        type: choice
        options: [smoke, fork, cold, warm, replay, save, fio, crash, "save,fio,crash", all]
        default: smoke
      systems:
        description: "Comma-separated systems for the measure (see bench/README.md); empty for all"
        type: string
        default: ""
      second_host:
        description: "Also start host b (cross-host cold and save measures)"
        type: boolean
        default: false
      max_hours:
        description: "Hosts power off this many hours after boot, if the destroy step never runs"
        type: number
        default: 6
      results_pr:
        description: "On main, open a pull request that merges the results into bench/results and redraws the charts"
        type: boolean
        default: false

concurrency:
  group: bench
  cancel-in-progress: false

permissions: {}

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  bench:
    name: Bench
    runs-on: ubuntu-latest
    environment: bench
    timeout-minutes: 350
    permissions:
      contents: read # check out the repository
      id-token: write # assume the bench AWS role through OIDC
    defaults:
      run:
        working-directory: bench/infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 21600

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false

      - name: Terraform init (state in the bench state bucket)
        env:
          STATE_BUCKET: ${{ vars.BENCH_STATE_BUCKET }}
        run: |
          printf 'terraform {\n  backend "s3" {}\n}\n' > backend_override.tf
          terraform init \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=bench/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"

      - name: Variables
        env:
          SECOND_HOST: ${{ inputs.second_host }}
          MAX_HOURS: ${{ inputs.max_hours }}
          BOUNDARY: ${{ vars.BENCH_HOST_BOUNDARY }}
        run: |
          # A key and an SSH rule for this run only: the runner's own address, a fresh key.
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/bench_key"
          mkdir -p ~/.ssh
          printf 'Host *\n  User ubuntu\n  IdentityFile %s\n  StrictHostKeyChecking accept-new\n  ConnectTimeout 10\n  ServerAliveInterval 30\n' \
            "$RUNNER_TEMP/bench_key" > ~/.ssh/config
          ip=$(curl -sf https://checkip.amazonaws.com)
          jq -n \
            --arg key "$(cat "$RUNNER_TEMP/bench_key.pub")" \
            --arg cidr "$ip/32" \
            --arg region "$AWS_REGION" \
            --arg boundary "$BOUNDARY" \
            --argjson second "$SECOND_HOST" \
            --argjson hours "$MAX_HOURS" \
            '{ssh_public_key: $key, ssh_cidrs: [$cidr], region: $region, host_permissions_boundary: $boundary,
              second_host: $second, max_hours: $hours}' > bench.auto.tfvars.json

      - name: Create the hosts
        if: inputs.action == 'run'
        run: terraform apply -auto-approve

      - name: Build pando while the hosts boot
        if: inputs.action == 'run'
        working-directory: .
        run: |
          rustup toolchain install
          cargo build --release --locked -p pando

      - name: Wait for the hosts
        if: inputs.action == 'run'
        run: |
          terraform output -json hosts | jq -r 'to_entries[] | "\(.key) \(.value)"' > "$RUNNER_TEMP/hosts"
          while read -r name ip; do
            for _ in $(seq 60); do
              ssh -n "$ip" true 2>/dev/null && break
              sleep 5
            done
            ssh -n "$ip" 'cloud-init status --wait >/dev/null; cloud-init status'
            echo "host $name ready"
          done < "$RUNNER_TEMP/hosts"

      - name: Copy the repository, pando and Pando's store keys to the hosts
        if: inputs.action == 'run'
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: |
          while read -r _ ip; do
            git -C "$GITHUB_WORKSPACE" archive --format=tar HEAD |
              ssh "$ip" 'rm -rf /data/pando && mkdir -p /data/pando && tar -x -C /data/pando'
            ssh "$ip" 'sudo sh -c "cat > /usr/local/bin/pando && chmod 0755 /usr/local/bin/pando"' \
              < "$GITHUB_WORKSPACE/target/release/pando"
            # Over stdin into a root-only file: never on a command line, in user data or in the log.
            printf 'S3_ACCESS_KEY_ID=%s\nS3_SECRET_ACCESS_KEY=%s\n' "$S3_ACCESS_KEY_ID" "$S3_SECRET_ACCESS_KEY" |
              ssh "$ip" 'sudo sh -c "umask 077; cat > /etc/pando-bench.secrets"'
          done < "$RUNNER_TEMP/hosts"

      - name: Smoke checks
        if: inputs.action == 'run'
        run: |
          status=0
          while read -r _ ip; do
            ssh -n "$ip" 'cd /data/pando && sudo bench/run.sh smoke' || status=1
          done < "$RUNNER_TEMP/hosts"
          exit $status

      - name: Measures (host a)
        if: inputs.action == 'run' && inputs.measure != 'smoke'
        env:
          MEASURE: ${{ inputs.measure }}
          SYSTEMS: ${{ inputs.systems }}
        run: |
          case $SYSTEMS in *[!a-z0-9,-]*) echo "systems: letters, digits, dashes and commas only" >&2; exit 2 ;; esac
          measures=${MEASURE//,/ }
          [ "$MEASURE" = all ] && measures="fork cold warm replay save fio crash"
          ip=$(awk '$1 == "a" {print $2}' "$RUNNER_TEMP/hosts")
          ssh -n "$ip" "cd /data/pando && sudo bench/run.sh workspace"
          status=0
          for m in $measures; do
            ssh -n "$ip" "cd /data/pando && sudo bench/run.sh $m ${SYSTEMS:+--systems $SYSTEMS}" || status=1
          done
          case " $measures " in *" crash "*) ;; *) exit $status ;; esac
          case ",${SYSTEMS:-pando}," in *,pando,*) ;; *) exit $status ;; esac
          for rep in 1 2 3 4 5; do
            boot=$(ssh -n "$ip" cat /proc/sys/kernel/random/boot_id)
            rc=0
            started="$RUNNER_TEMP/crash-reboot-$rep.log"
            timeout 1800 ssh -n -o ServerAliveInterval=5 -o ServerAliveCountMax=3 "$ip" \
              "cd /data/pando && sudo bench/run.sh crash-reboot start --rep $rep" >"$started" 2>&1 || rc=$?
            cat "$started"
            if [ "$rc" != 255 ] || ! grep -q ', rebooting$' "$started"; then
              echo "crash-reboot start $rep exited with $rc before the reboot" >&2
              status=1
              break
            fi
            back=
            for _ in $(seq 120); do
              sleep 5
              now=$(ssh -n -o ConnectTimeout=5 "$ip" cat /proc/sys/kernel/random/boot_id 2>/dev/null) || continue
              if [ "$now" != "$boot" ]; then back=1; break; fi
            done
            if [ -z "$back" ]; then echo "host a did not come back from reboot $rep" >&2; status=1; break; fi
            ssh -n "$ip" 'timeout 300 sh -c "until mountpoint -q /data; do sleep 2; done"' || status=1
            ssh -n "$ip" "cd /data/pando && sudo bench/run.sh crash-reboot check --rep $rep" || status=1
          done
          ssh -n "$ip" "cd /data/pando && sudo bench/run.sh crash-reboot clean" || status=1
          exit $status

      - name: Collect the results
        if: always() && inputs.action == 'run'
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          while read -r name ip; do
            ssh -n "$ip" 'sudo tar -C /data/results -c .' |
              tar -x -C "$RUNNER_TEMP/results" || echo "no results from host $name"
          done < "$RUNNER_TEMP/hosts"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && inputs.action == 'run'
        with:
          name: bench-results-${{ github.run_id }}
          path: ${{ runner.temp }}/results
          if-no-files-found: warn

      # The EBS rows make snapshots and volumes outside Terraform; remove what a failed run left.
      - name: Delete EBS snapshots and volumes the harness made
        if: always()
        run: |
          filters=("Name=tag:Project,Values=pando-bench" "Name=tag:Origin,Values=harness")
          for v in $(aws ec2 describe-volumes --filters "${filters[@]}" --query 'Volumes[].VolumeId' --output text); do
            aws ec2 delete-volume --volume-id "$v" || echo "could not delete volume $v"
          done
          for s in $(aws ec2 describe-snapshots --owner-ids self --filters "${filters[@]}" --query 'Snapshots[].SnapshotId' --output text); do
            aws ec2 delete-snapshot --snapshot-id "$s" || echo "could not delete snapshot $s"
          done

      - name: Destroy everything
        if: always()
        run: terraform destroy -auto-approve

  results:
    name: Results pull request
    needs: bench
    if: >-
      inputs.action == 'run' && inputs.measure != 'smoke' && inputs.results_pr &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      needs.bench.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Token of the infrastructure app, so the results pull request runs the checks
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bench-results-${{ github.run_id }}
          path: ${{ runner.temp }}/results

      - name: Merge the results, redraw the charts and open the pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          MEASURE: ${{ inputs.measure }}
          SYSTEMS: ${{ inputs.systems }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          merged=$(python3 bench/merge.py "$RUNNER_TEMP/results")
          python3 bench/plot.py
          if git diff --quiet; then echo "the results change nothing"; exit 0; fi
          short=${GITHUB_SHA::7}
          branch="bench/results-$GITHUB_RUN_ID"
          id=$(gh api "/users/$APP_SLUG%5Bbot%5D" --jq .id)
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$id+$APP_SLUG[bot]@users.noreply.github.com"
          gh auth setup-git
          git switch -c "$branch"
          git add bench/results docs/bench README.md
          git commit -q -m "docs(bench): ${MEASURE//,/, } results from main at $short" \
            -m "From $RUN_URL, systems: ${SYSTEMS:-all}."
          git push -q origin "$branch"
          printf 'Results of %s at %s, measure `%s`, systems `%s`.\n\nFiles and the systems they replace:\n\n```\n%s\n```\n\nThe crash table in the README is written by hand: check it against bench/results/crash.csv.\n' \
            "$RUN_URL" "$GITHUB_SHA" "$MEASURE" "${SYSTEMS:-all}" "$merged" > "$RUNNER_TEMP/body.md"
          gh pr create --base "${GITHUB_REF#refs/heads/}" --head "$branch" \
            --title "docs(bench): ${MEASURE//,/, } results from main at $short" --body-file "$RUNNER_TEMP/body.md"
