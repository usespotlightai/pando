name: release

# Builds pando for x86_64 and aarch64 Linux on GitHub's Ubuntu 24.04 runners, so the binaries
# need glibc 2.39 or newer. A tag vX.Y.Z, which must match the workspace version, publishes the
# archives as a GitHub release with packaging/install.sh, SHA256SUMS over all of them, and a
# build provenance attestation for each. Started by hand, or by a pull request that changes the
# packaging, it builds and keeps the archives as workflow artifacts. Nothing here restores a cache, so no other workflow can change what a
# release is built from. docs/releasing.md says how to cut a release.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packaging/**
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  GLIBC_MAX: "2.39"

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain from rust-toolchain.toml, and cargo-auditable as tools/install.sh pins it
        run: |
          rustup toolchain install
          tool=$(grep -o 'cargo-auditable@[0-9.]*' tools/install.sh)
          cargo install --quiet --locked "$tool"

      - name: Release build with its dependency list embedded
        run: tools/check.sh release

      - name: Version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          built=$(target/release/pando --version)
          built=${built#pando }
          if [[ $REF_TYPE == tag ]]; then
            if [[ $REF_NAME != "v$built" ]]; then
              echo "tag $REF_NAME does not match the workspace version $built" >&2
              exit 1
            fi
            version=$built
          else
            version=$built-dev.${GITHUB_SHA::12}
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: The binary needs glibc ${{ env.GLIBC_MAX }} at most
        run: |
          need=$(objdump -T target/release/pando | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "needs glibc $need"
          [[ $(printf '%s\n' "$need" "$GLIBC_MAX" | sort -V | tail -1) == "$GLIBC_MAX" ]]

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: packaging/package.sh "$VERSION" "$ARCH" target/release/pando dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pando-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # creates the release and uploads its files
      id-token: write # signs the provenance attestation
      attestations: write # stores the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pando-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cp packaging/install.sh dist/
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          {
            echo "Install or upgrade a host (docs/hosts.md):"
            echo
            echo '```'
            echo "curl -fsSLO https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/install.sh"
            echo "curl -fsSLO https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/SHA256SUMS"
            echo "sha256sum -c --ignore-missing SHA256SUMS"
            echo "sudo bash install.sh --restart $version"
            echo '```'
            echo
            echo "Check an archive's provenance with \`gh attestation verify <archive> --repo $GITHUB_REPOSITORY\`."
            echo "The binaries need Linux with ublk and glibc $GLIBC_MAX or newer."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --verify-tag --title "pando $version" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes dist/*
