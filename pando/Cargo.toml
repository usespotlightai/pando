[package]
name = "pando"
description = "Branchable copy-on-write block devices on object storage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
pando-engine.workspace = true
pando-host.workspace = true
pando-format.workspace = true
pando-s3.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
pando-linux.workspace = true

[dev-dependencies]
pando-engine = { workspace = true, features = ["sim"] }
tempfile.workspace = true

[lints]
workspace = true
