allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = true
avoid-breaking-exported-api = false
disallowed-methods = [
    { path = "std::time::Instant::now", reason = "the format has no clock" },
    { path = "std::time::SystemTime::now", reason = "the format has no clock" },
    { path = "std::fs::read", reason = "the format does no I/O" },
    { path = "std::fs::write", reason = "the format does no I/O" },
    { path = "std::fs::File::open", reason = "the format does no I/O" },
    { path = "std::fs::File::create", reason = "the format does no I/O" },
]
