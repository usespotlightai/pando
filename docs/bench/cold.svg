<svg xmlns="http://www.w3.org/2000/svg" width="760" height="406" viewBox="0 0 760 406" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
  <title>Cold start: empty host to first git status</title>
  <desc>Bar chart of the time from an empty host to the first git status finishing, per system</desc>
  <text x="0" y="20" font-size="16" font-weight="600" fill="#1f2328">Cold start: empty host to first git status</text>
  <text x="0" y="52" font-size="13" fill="#59636e">fork, mount and git status done (lower is better, log scale)</text>
  <line x1="212.0" y1="62" x2="212.0" y2="374" stroke="#eaeef2" stroke-width="1"/>
  <text x="212.0" y="388" font-size="11" fill="#59636e" text-anchor="middle">1 s</text>
  <line x1="366.7" y1="62" x2="366.7" y2="374" stroke="#eaeef2" stroke-width="1"/>
  <text x="366.7" y="388" font-size="11" fill="#59636e" text-anchor="middle">10 s</text>
  <line x1="521.3" y1="62" x2="521.3" y2="374" stroke="#eaeef2" stroke-width="1"/>
  <text x="521.3" y="388" font-size="11" fill="#59636e" text-anchor="middle">100 s</text>
  <line x1="676.0" y1="62" x2="676.0" y2="374" stroke="#eaeef2" stroke-width="1"/>
  <text x="676.0" y="388" font-size="11" fill="#59636e" text-anchor="middle">16.7 min</text>
  <line x1="212" y1="62" x2="212" y2="374" stroke="#d1d9e0" stroke-width="1"/>
  <text x="202" y="79.0" font-size="12" fill="#1f2328" text-anchor="end" font-weight="600">Pando</text>
  <path d="M212,68.0 h7.8 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-7.8 z" fill="#0969da"><title>Pando: 1.19 s (range 1.15 s to 2.6 s)</title></path>
  <text x="229.8" y="79.0" font-size="12" fill="#59636e">1.19 s</text>
  <text x="202" y="105.0" font-size="12" fill="#1f2328" text-anchor="end">tar from S3</text>
  <path d="M212,94.0 h96.1 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-96.1 z" fill="#818b98"><title>tar from S3: 4.44 s (range 4.41 s to 4.48 s)</title></path>
  <text x="318.1" y="105.0" font-size="12" fill="#59636e">4.44 s</text>
  <text x="202" y="131.0" font-size="12" fill="#1f2328" text-anchor="end">image download from S3</text>
  <path d="M212,120.0 h100.2 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-100.2 z" fill="#818b98"><title>image download from S3: 4.72 s (range 4.69 s to 4.79 s)</title></path>
  <text x="322.2" y="131.0" font-size="12" fill="#59636e">4.72 s</text>
  <text x="202" y="157.0" font-size="12" fill="#1f2328" text-anchor="end">EBS snapshot to volume</text>
  <path d="M212,146.0 h156.4 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-156.4 z" fill="#818b98"><title>EBS snapshot to volume: 10.9 s (range 10.1 s to 12 s)</title></path>
  <text x="378.4" y="157.0" font-size="12" fill="#59636e">10.9 s</text>
  <text x="202" y="183.0" font-size="12" fill="#1f2328" text-anchor="end">Docker (overlayfs)</text>
  <path d="M212,172.0 h217.2 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-217.2 z" fill="#818b98"><title>Docker (overlayfs): 26.9 s (range 26.8 s to 27.3 s)</title></path>
  <text x="439.2" y="183.0" font-size="12" fill="#59636e">26.9 s</text>
  <text x="202" y="209.0" font-size="12" fill="#1f2328" text-anchor="end">JuiceFS</text>
  <path d="M212,198.0 h362.1 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-362.1 z" fill="#818b98"><title>JuiceFS: 3.88 min (range 3.8 min to 3.92 min)</title></path>
  <text x="584.1" y="209.0" font-size="12" fill="#59636e">3.88 min</text>
  <text x="202" y="235.0" font-size="12" fill="#1f2328" text-anchor="end">SOCI lazy pull</text>
  <text x="220" y="235.0" font-size="12" font-style="italic" fill="#59636e">not measured yet</text>
  <text x="202" y="261.0" font-size="12" fill="#1f2328" text-anchor="end">Nydus lazy pull</text>
  <text x="220" y="261.0" font-size="12" font-style="italic" fill="#59636e">not measured yet</text>
  <text x="202" y="287.0" font-size="12" fill="#1f2328" text-anchor="end">ZeroFS (NBD)</text>
  <text x="220" y="287.0" font-size="12" font-style="italic" fill="#59636e">not measured yet</text>
  <text x="202" y="313.0" font-size="12" fill="#1f2328" text-anchor="end">Amazon S3 Files</text>
  <text x="220" y="313.0" font-size="12" font-style="italic" fill="#59636e">not measured yet</text>
  <text x="202" y="339.0" font-size="12" fill="#1f2328" text-anchor="end">Archil</text>
  <text x="220" y="339.0" font-size="12" font-style="italic" fill="#59636e">not measured yet</text>
  <text x="202" y="365.0" font-size="12" fill="#1f2328" text-anchor="end">XFS reflink (local)</text>
  <text x="220" y="365.0" font-size="12" font-style="italic" fill="#59636e">local only</text>
</svg>
