<svg xmlns="http://www.w3.org/2000/svg" width="760" height="670" viewBox="0 0 760 670" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
  <title>Fork: time to a writable branch</title>
  <desc>Bar chart of the time each system takes to make a writable branch of the workspace</desc>
