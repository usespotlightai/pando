<svg xmlns="http://www.w3.org/2000/svg" width="760" height="406" viewBox="0 0 760 406" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
  <title>Warm start: host that ran a sibling branch</title>
  <desc>Bar chart of the time to the first git status on a host that already ran a branch of the same base</desc>
  <text x="0" y="20" font-size="16" font-weight="600" fill="#1f2328">Warm start: host that ran a sibling branch</text>
  <text x="0" y="52" font-size="13" fill="#59636e">fork, mount and git status done (lower is better, log scale)</text>
  <line x1="212.0" y1="62" x2="212.0" y2="374" stroke="#eaeef2" stroke-width="1"/>
  <text x="212.0" y="388" font-size="11" fill="#59636e" text-anchor="middle">100 ms</text>
  <line x1="366.7" y1="62" x2="366.7" y2="374" stroke="#eaeef2" stroke-width="1"/>
  <text x="366.7" y="388" font-size="11" fill="#59636e" text-anchor="middle">1 s</text>
  <line x1="521.3" y1="62" x2="521.3" y2="374" stroke="#eaeef2" stroke-width="1"/>
  <text x="521.3" y="388" font-size="11" fill="#59636e" text-anchor="middle">10 s</text>
  <line x1="676.0" y1="62" x2="676.0" y2="374" stroke="#eaeef2" stroke-width="1"/>
  <text x="676.0" y="388" font-size="11" fill="#59636e" text-anchor="middle">100 s</text>
  <line x1="212" y1="62" x2="212" y2="374" stroke="#d1d9e0" stroke-width="1"/>
  <text x="202" y="79.0" font-size="12" fill="#1f2328" text-anchor="end">XFS reflink (local)</text>
  <path d="M212,68.0 h112.1 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-112.1 z" fill="#818b98"><title>XFS reflink (local): 563 ms (range 410 ms to 613 ms)</title></path>
  <text x="334.1" y="79.0" font-size="12" fill="#59636e">563 ms</text>
  <text x="202" y="105.0" font-size="12" fill="#1f2328" text-anchor="end">Docker (overlayfs)</text>
