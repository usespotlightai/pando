<svg xmlns="http://www.w3.org/2000/svg" width="760" height="388" viewBox="0 0 760 388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
  <title>Warm start: host that ran a sibling branch</title>
  <desc>Bar chart of the time to the first git status on a host that already ran a branch of the same base</desc>
